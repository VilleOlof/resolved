[package]
name = "lua_module"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
mlua = { version = "0.12", features = [
    "lua51",
    "module",
    "serde",
], default-features = false }
tiny_http = "0.12"
rmp-serde = "1.3.1"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"

[build-dependencies]
which = "8.0.5"
