[package]
name = "vinci"
version = "0.1.0"
edition = "2024"

[dependencies]
rmp-serde = "1.3.1"
reqwest = { version = "0.13.4", features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
bytes = "1.12"
tempfile = "3"
tokio = { version = "1.52", features = ["full"] }


[workspace]
members = ["lua_module"]
resolver = "3"
