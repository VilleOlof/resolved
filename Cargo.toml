[package]
name = "resolved"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["lua_module", "build_lib", "resolved_shared", "fudummy"]
resolver = "3"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
resolved_shared = { path = "./resolved_shared" }
mlua = { version = "0.12", default-features = false }
rmp-serde = "1.3"
thiserror = "2"
bytes = "1.12"

[dependencies]
resolved_shared = { workspace = true }
rmp-serde = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
bytes = { workspace = true }
tokio = { version = "1.52", features = [
    "net",
    "fs",
    "macros",
    "process",
    "io-util",
    "sync",
] }
futures = "0.3"
tempfile = "3"
fastrand = "2.5"

[dev-dependencies]
criterion = { version = "0.5.1", features = ["async_tokio"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "time"] }

[[bench]]
name = "simple"
harness = false
