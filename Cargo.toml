[package]
name = "resolved"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["lua_module", "build_lib", "resolved_shared"]
resolver = "3"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
resolved_shared = { path = "./resolved_shared" }
rmp-serde = "1.3"
thiserror = "2"

[dependencies]
resolved_shared = { workspace = true }
rmp-serde = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
tokio = { version = "1.52", features = ["net", "fs", "macros", "process"] }
reqwest = { version = "0.13" }
futures = "0.3"
bytes = "1.12"
tempfile = "3"
url = "2.5.8"

[dev-dependencies]
criterion = { version = "0.5.1", features = ["async_tokio"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "time"] }

[[bench]]
name = "simple"
harness = false
