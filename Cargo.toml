[package]
name = "resolved"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["lua_module"]
resolver = "3"

[dependencies]
rmp-serde = "1.3"
reqwest = { version = "0.13" }
serde = { version = "1.0", features = ["derive"] }
bytes = "1.12"
tempfile = "3"
tokio = { version = "1.52", features = ["net", "fs", "macros", "process"] }
thiserror = "2"
url = "2.5.8"
futures = "0.3"

[dev-dependencies]
criterion = { version = "0.5.1", features = ["async_tokio"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "time"] }

[[bench]]
name = "simple"
harness = false
